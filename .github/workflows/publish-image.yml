---
name: Publish Image

on:
  # Every merge to main republishes. This is deliberately not path-scoped and
  # has no skip condition: the image previously moved only on a release or a
  # manual dispatch, there were no releases, and it sat seven weeks behind
  # main -- long enough that every repo generated from `latest` shipped stale
  # action pins and collected Dependabot PRs on creation. A few minutes of
  # build time per merge is cheaper than that going unnoticed again.
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Two merges in quick succession must not race to push `latest`. Newest wins:
# an in-flight publish for an older commit is cancelled rather than allowed to
# overwrite a newer one. Keyed by ref so a release publish is never cancelled
# by a push to main.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine version, short SHA, and lowercased owner
        id: meta
        run: |
          VERSION="$(python3 ./atomic_image_builder.py --version | awk '{print $2}')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # GHCR image references must be lowercase; the owner login may not be
          # (e.g. "Danathar"). Lowercase it before building the registry path.
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "owner_lc=${OWNER_LC}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: atomic-image-builder
          tags: latest ${{ steps.meta.outputs.version }} ${{ steps.meta.outputs.short_sha }}
          containerfiles: |
            ./Containerfile
          platforms: linux/amd64
          squash: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io/${{ steps.meta.outputs.owner_lc }}
