---
name: Publish Image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine version, short SHA, and lowercased owner
        id: meta
        run: |
          VERSION="$(python3 ./atomic_image_builder.py --version | awk '{print $2}')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # GHCR image references must be lowercase; the owner login may not be
          # (e.g. "Danathar"). Lowercase it before building the registry path.
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "owner_lc=${OWNER_LC}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          image: atomic-image-builder
          tags: latest ${{ steps.meta.outputs.version }} ${{ steps.meta.outputs.short_sha }}
          containerfiles: |
            ./Containerfile
          platforms: linux/amd64
          squash: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io/${{ steps.meta.outputs.owner_lc }}
