---
name: Publish Image

on:
  # Every merge to main republishes. This is deliberately not path-scoped and
  # has no skip condition: the image previously moved only on a release or a
  # manual dispatch, there were no releases, and it sat seven weeks behind
  # main -- long enough that every repo generated from `latest` shipped stale
  # action pins and collected Dependabot PRs on creation. A few minutes of
  # build time per merge is cheaper than that going unnoticed again.
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# One group per ref: every merge to main shares refs/heads/main, and each
# release (or dispatch on a tag) gets a group of its own. GitHub keeps at most
# one *pending* run per group and cancels it when a newer one queues;
# cancel-in-progress: false protects only the running member. So while a
# release shared main's group, a release queued behind a main build was
# cancelled before it started by the next merge to land.
#
# Separate groups cannot race for `latest`, because only a build of main
# writes it (see the meta step) and those all run in the one group. A release
# cut from an older commit therefore cannot drag `latest` backwards however
# the two interleave. Otherwise they meet on a SHA tag only when they built
# the same commit, and on the version tag only while a main build still
# writes it (#533).
#
# Within main's group, queued runs still supersede each other, so a burst of
# merges settles on the newest commit without cancelling a build mid-flight.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing exchanges this for a short-lived Fulcio certificate.
      # No key material enters the repository and there is nothing to rotate.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine version, short SHA, and lowercased owner
        id: meta
        run: |
          VERSION="$(python3 ./atomic_image_builder.py --version | awk '{print $2}')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # GHCR image references must be lowercase; the owner login may not be
          # (e.g. "Danathar"). Lowercase it before building the registry path.
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          # `latest` means the tip of main, so only a main build may claim it.
          # A release is published from a tag ref, and one cut from an older
          # commit must not drag `latest` backwards; it still gets the version
          # and SHA tags, which is what identifies a release anyway.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="latest ${VERSION} ${SHORT_SHA}"
          else
            TAGS="${VERSION} ${SHORT_SHA}"
          fi
          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "owner_lc=${OWNER_LC}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: atomic-image-builder
          tags: ${{ steps.meta.outputs.tags }}
          containerfiles: |
            ./Containerfile
          platforms: linux/amd64
          squash: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io/${{ steps.meta.outputs.owner_lc }}

      # Already in ACTION_PINS -- the generated Containerfile workflow uses the
      # same pin -- so this adds nothing to the table that ships to strangers'
      # repos, which is the objection that keeps other actions out of here.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      # Sign the digest, not a tag. Tags are rewritten on the next merge; the
      # digest is what was actually built here, and it is what `cosign verify`
      # resolves a tag to anyway. Keyless signing publishes the certificate to
      # the public Rekor transparency log; the entry records the repository,
      # workflow path and commit, all already public here.
      - name: Sign the published image
        env:
          IMAGE: ghcr.io/${{ steps.meta.outputs.owner_lc }}/atomic-image-builder
          DIGEST: ${{ steps.push-to-ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y "${IMAGE}@${DIGEST}"
