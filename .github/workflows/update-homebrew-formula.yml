---
name: Update Homebrew Formula

# The formula pins a release tarball and its sha256, and neither exists until
# the tag is published -- so the formula is always updated after a release.
# That made it the one step in the process with nothing forcing it to happen,
# while a formula left behind keeps installing the previous version. This runs
# it automatically instead.
#
# It commits the change on a `formula/<tag>` branch and opens a pull request
# against main; it never pushes to main. That keeps it working once the
# `protect main` ruleset (.github/rulesets/main.json) is applied, which has no
# bypass for anyone.
#
# The branch push and the pull request use a GitHub App token, not
# GITHUB_TOKEN, for two reasons. Actions is not permitted to create pull
# requests in this repository. And GitHub starts no workflow runs for a pull
# request opened with GITHUB_TOKEN, so the required `test` check would never
# report and the pull request would wait forever. A pull request opened by an
# App does start CI. The App and its two secrets are set up by hand; see
# docs/branch-protection.md.
on:
  release:
    types: [published]
  # For re-running against a release that was published before this workflow
  # existed, or after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to point the formula at (e.g. v0.9.1)"
        required: true

# GITHUB_TOKEN only reads: every write in this job (the branch push, the pull
# request, auto-merge) goes through the App token minted below.
permissions:
  contents: read

# Serialized: two releases in quick succession must not race to rewrite the
# same file. Not cancel-in-progress -- an interrupted run could leave the
# formula updated locally but unpushed, which looks like success and is not.
concurrency:
  group: update-homebrew-formula
  cancel-in-progress: false

jobs:
  update:
    name: Point the formula at the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Without the App there is no way to publish the change, and a formula
      # left on the previous release installs the wrong version with no error
      # anywhere. So a missing secret fails the run, red, rather than skipping
      # or falling back to a direct push. Only whether each secret is set
      # reaches this step, never the secret itself.
      - name: Check the formula App secrets are set
        id: secrets
        env:
          HAS_APP_ID: ${{ secrets.FORMULA_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.FORMULA_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_APP_ID" = "true" ] || missing+=(FORMULA_APP_ID)
          [ "$HAS_APP_KEY" = "true" ] || missing+=(FORMULA_APP_PRIVATE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Formula App secrets missing::The FORMULA_APP_ID and FORMULA_APP_PRIVATE_KEY repository secrets must both be set; missing: ${missing[*]}. This workflow opens the formula pull request with that GitHub App's token. docs/branch-protection.md says how to create the App and set the secrets."
            exit 1
          fi

      # The release event checks out the tag; the formula lives on main.
      # persist-credentials: false, because GITHUB_TOKEN here can only read;
      # the push below authenticates with the App token instead.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      # homebrew_formula.py's --update path is unit-tested only against a
      # mocked fetch_sha256 (see tests/test_homebrew_formula.py), so the unit
      # number for this module is 100% without a single real tarball download
      # ever having been measured. A release is the only place --update runs
      # for real, which makes it the only place that measurement can be taken.
      # .coveragerc.maintenance-audit already scopes exactly these maintainer
      # scripts for this same "real run against live GitHub" purpose, so it is
      # reused rather than adding a fourth coverage config.
      # continue-on-error, because this measurement is advisory and updating
      # the formula is not. Before this step existed the job needed nothing
      # but python3 and the standard library; a PyPI outage or a broken
      # coverage release must not be what leaves a published release pinned to
      # the previous version. A failure here still shows up red in the run, and
      # the step below falls back to running the script unmeasured.
      - name: Install coverage tooling
        continue-on-error: true
        run: pip install coverage==7.16.0

      - name: Point the formula at the release
        id: update
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # Same reason as the step above: fall back to bare python rather than
          # let a missing coverage stop the release from being picked up.
          if python3 -m coverage --version >/dev/null 2>&1; then
            update=(python3 -m coverage run --rcfile=.coveragerc.maintenance-audit)
            # -a appends to the data file the --update run wrote, so one report
            # covers both invocations. Coverage warns here that
            # maintenance_audit is never imported -- that is expected and
            # harmless: this job runs only the one script the shared config
            # names, and coverage omits the absent module from the report.
            check=("${update[@]}" -a)
          else
            echo "::warning::coverage unavailable; updating the formula without measuring it"
            update=(python3)
            check=(python3)
          fi
          "${update[@]}" homebrew_formula.py --update "$TAG"
          # Verified independently of the code that just wrote it. This also
          # fails when a release was tagged without bumping VERSION first,
          # because --check compares the formula's tag against VERSION -- and
          # that release would ship a formula whose own test block cannot pass.
          "${check[@]}" homebrew_formula.py --check
          if git diff --quiet -- Formula/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Minted after the formula is written and verified, so nothing that runs
      # the release's Python ever holds it. Minted on every run, not only when
      # the formula changed: a dispatch for the tag the formula already names
      # then proves the App ID, key, installation and permissions without
      # opening a pull request. Scoped to this repository, with only the two
      # permissions the steps below use.
      - name: Mint the formula App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FORMULA_APP_ID }}
          private-key: ${{ secrets.FORMULA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # git asks the credential helper for a password only for this step, and
      # the helper reads the token from the environment, so the token is never
      # written to .git/config.
      - name: Push the formula branch
        if: steps.update.outputs.changed == 'true'
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Scoped to Formula/ rather than committing every modified tracked
          # file with -a. The step's `if:` gate tests `git diff --quiet --
          # Formula/` and `--check` verifies only the formula, so those are the
          # paths this job has actually established anything about. A pathspec
          # keeps the commit's contents equal to the verified change instead of
          # equal to whatever the working tree happened to hold.
          #
          # Fails closed if that ever diverges: another modified tracked file
          # is left unstaged, and `git rebase` below refuses to run against a
          # dirty tree, so the release goes red rather than quietly publishing
          # it. Still exits non-zero when the formula itself did not change,
          # which is what makes the `if:` above load-bearing.
          git commit -m "Point the Homebrew formula at ${TAG}" -- Formula/
          # main may have moved while the release was being published.
          git fetch origin main
          git rebase origin/main
          # --force: the branch belongs to this workflow. A re-run for the same
          # tag replaces what an earlier run pushed, and an open pull request
          # for the branch picks up the new commit.
          git push --force origin "HEAD:refs/heads/formula/${TAG}"

      # Reuses the open pull request for the branch when a re-run finds one.
      # The body goes through a file so nothing in it is parsed by the shell.
      - name: Open the formula pull request
        id: pr
        if: steps.update.outputs.changed == 'true'
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="formula/${TAG}"
          url="$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "$url" ]; then
            body="$RUNNER_TEMP/formula-pr-body.md"
            {
              echo "Points Formula/atomic-image-builder.rb at the ${TAG} release tarball and its sha256."
              echo
              echo "Opened by the Update Homebrew Formula workflow: ${RUN_URL}"
              echo "The job checked the new pin with homebrew_formula.py --check before pushing."
              echo "Homebrew users get ${TAG} on their next brew upgrade after this merges."
            } > "$body"
            url="$(gh pr create --base main --head "$branch" --title "Point the Homebrew formula at ${TAG}" --body-file "$body")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Turns on GitHub's auto-merge, so the pull request merges by itself once
      # the checks main requires have passed. Not `gh pr merge --auto`: when
      # nothing is required yet -- before the ruleset is applied -- gh merges
      # on the spot without waiting for `test`. The mutation below never
      # merges; it only turns auto-merge on, and GitHub refuses when the
      # repository does not allow auto-merge or nothing is required. Either
      # way the pull request stays open for a person to merge. That is written
      # to the summary as a warning, not a failure: the formula change is
      # already visible as an open pull request.
      - name: Turn on auto-merge
        id: automerge
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          id="$(gh pr view "$PR_URL" --json id --jq .id)"
          # $id is a GraphQL variable, not a shell one.
          # shellcheck disable=SC2016
          if reason="$(gh api graphql \
              -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) { clientMutationId } }' \
              -f id="$id" 2>&1 >/dev/null)"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            reason="$(printf '%s' "$reason" | tr '\n' ' ')"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::warning title=Formula pull request left open::Auto-merge could not be turned on for ${PR_URL}, so it needs merging by hand. GitHub said: ${reason}"
          fi

      - name: Summarize
        if: always()
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SECRETS: ${{ steps.secrets.outcome }}
          CHANGED: ${{ steps.update.outputs.changed }}
          PR_URL: ${{ steps.pr.outputs.url }}
          AUTO_MERGE: ${{ steps.automerge.outputs.enabled }}
          AUTO_MERGE_REASON: ${{ steps.automerge.outputs.reason }}
        run: |
          {
            echo "## Homebrew formula"
            echo
            if [ "$SECRETS" = "failure" ]; then
              echo "Did not run: the \`FORMULA_APP_ID\` and \`FORMULA_APP_PRIVATE_KEY\` secrets are not both set. See docs/branch-protection.md."
            elif [ "$CHANGED" = "true" ] && [ -n "$PR_URL" ]; then
              echo "Pointed at \`${TAG}\` in ${PR_URL}. Users get it on their next \`brew update && brew upgrade\` after it merges."
              echo
              if [ "$AUTO_MERGE" = "true" ]; then
                echo "Auto-merge is on: it merges by itself once the required checks pass."
              elif [ "$AUTO_MERGE" = "false" ]; then
                echo "**Auto-merge is not on, so the pull request stays open until someone merges it.** GitHub said: ${AUTO_MERGE_REASON}"
              else
                echo "**Auto-merge was not attempted.** Check the pull request and merge it by hand."
              fi
            elif [ "$CHANGED" = "true" ]; then
              echo "Updated the formula for \`${TAG}\` but did not open a pull request. The steps above say why."
            elif [ "$CHANGED" = "false" ]; then
              echo "Already pointed at \`${TAG}\`; nothing to do."
            else
              echo "Did not update the formula for \`${TAG}\`. Run this locally to see why:"
              echo
              echo '```'
              echo "python3 homebrew_formula.py --update ${TAG}"
              echo "python3 homebrew_formula.py --check"
              echo '```'
            fi
            echo
            echo '```'
            grep -E '^\s+(url|sha256)' Formula/atomic-image-builder.rb || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory only, like the weekly maintenance-audit coverage: this reports
      # what this real release run reached, it does not gate. A branch that
      # only a real tarball download or a real formula rewrite trips stays
      # missing here even on a clean pass, which the mocked unit suite cannot
      # tell you on its own.
      #
      # Runs after the push deliberately: nothing here may sit between the
      # formula being written and the formula being pushed.
      - name: Report homebrew-release coverage
        if: always()
        run: |
          {
            echo "## Homebrew-release coverage"
            echo
            echo "Measured from this run's real tarball download and formula"
            echo "rewrite. Not gated, and not comparable to the unit,"
            echo "end-to-end, or maintenance-audit coverage numbers reported"
            echo "elsewhere."
            echo '```'
            python3 -m coverage report --rcfile=.coveragerc.maintenance-audit || echo "(no coverage data collected)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The raw data file goes under data/ to match the other coverage
      # artifacts' layout, so the combine recipe in CONTRIBUTING.md works on
      # this one too.
      - name: Package homebrew-release coverage
        if: always()
        run: |
          mkdir -p homebrew-release-coverage/data
          python3 -m coverage xml --rcfile=.coveragerc.maintenance-audit -o homebrew-release-coverage/coverage.xml || true
          python3 -m coverage html --rcfile=.coveragerc.maintenance-audit -d homebrew-release-coverage/htmlcov || true
          cp .coverage homebrew-release-coverage/data/.coverage.homebrew-release || true

      - name: Upload homebrew-release coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-homebrew-release
          path: homebrew-release-coverage/
          include-hidden-files: true
          retention-days: 30
