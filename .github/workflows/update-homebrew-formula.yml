---
name: Update Homebrew Formula

# The formula pins a release tarball and its sha256, and neither exists until
# the tag is published -- so the formula is always updated after a release.
# That made it the one step in the process with nothing forcing it to happen,
# while a formula left behind keeps installing the previous version. This runs
# it automatically instead.
#
# It pushes straight to main rather than opening a pull request: Actions is not
# permitted to create pull requests in this repository. The change is a single
# machine-generated sha256 that the job verifies before pushing, and the weekly
# maintenance audit re-checks it independently afterwards.
on:
  release:
    types: [published]
  # For re-running against a release that was published before this workflow
  # existed, or after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to point the formula at (e.g. v0.9.1)"
        required: true

permissions:
  contents: write

# Serialized: two releases in quick succession must not race to rewrite the
# same file. Not cancel-in-progress -- an interrupted run could leave the
# formula updated locally but unpushed, which looks like success and is not.
concurrency:
  group: update-homebrew-formula
  cancel-in-progress: false

jobs:
  update:
    name: Point the formula at the release
    runs-on: ubuntu-24.04
    steps:
      # The release event checks out the tag; the formula lives on main.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      # homebrew_formula.py's --update path is unit-tested only against a
      # mocked fetch_sha256 (see tests/test_homebrew_formula.py), so the unit
      # number for this module is 100% without a single real tarball download
      # ever having been measured. A release is the only place --update runs
      # for real, which makes it the only place that measurement can be taken.
      # .coveragerc.maintenance-audit already scopes exactly these maintainer
      # scripts for this same "real run against live GitHub" purpose, so it is
      # reused rather than adding a fourth coverage config.
      # continue-on-error, because this measurement is advisory and updating
      # the formula is not. Before this step existed the job needed nothing
      # but python3 and the standard library; a PyPI outage or a broken
      # coverage release must not be what leaves a published release pinned to
      # the previous version. A failure here still shows up red in the run, and
      # the step below falls back to running the script unmeasured.
      - name: Install coverage tooling
        continue-on-error: true
        run: pip install coverage

      - name: Point the formula at the release
        id: update
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # Same reason as the step above: fall back to bare python rather than
          # let a missing coverage stop the release from being picked up.
          if python3 -m coverage --version >/dev/null 2>&1; then
            update=(python3 -m coverage run --rcfile=.coveragerc.maintenance-audit)
            # -a appends to the data file the --update run wrote, so one report
            # covers both invocations. Coverage warns here that
            # maintenance_audit is never imported -- that is expected and
            # harmless: this job runs only the one script the shared config
            # names, and coverage omits the absent module from the report.
            check=("${update[@]}" -a)
          else
            echo "::warning::coverage unavailable; updating the formula without measuring it"
            update=(python3)
            check=(python3)
          fi
          "${update[@]}" homebrew_formula.py --update "$TAG"
          # Verified independently of the code that just wrote it. This also
          # fails when a release was tagged without bumping VERSION first,
          # because --check compares the formula's tag against VERSION -- and
          # that release would ship a formula whose own test block cannot pass.
          "${check[@]}" homebrew_formula.py --check
          if git diff --quiet -- Formula/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point the Homebrew formula at ${TAG}"
          # main may have moved while the release was being published.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Summarize
        if: always()
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          {
            echo "## Homebrew formula"
            echo
            if [ "${{ steps.update.outputs.changed }}" = "true" ]; then
              echo "Pointed at \`${TAG}\` and pushed to \`main\`. Users get it on their next \`brew update && brew upgrade\`."
            elif [ "${{ steps.update.outputs.changed }}" = "false" ]; then
              echo "Already pointed at \`${TAG}\`; nothing to do."
            else
              echo "Did not update the formula for \`${TAG}\`. Run this locally to see why:"
              echo
              echo '```'
              echo "python3 homebrew_formula.py --update ${TAG}"
              echo "python3 homebrew_formula.py --check"
              echo '```'
            fi
            echo
            echo '```'
            grep -E '^\s+(url|sha256)' Formula/atomic-image-builder.rb || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory only, like the weekly maintenance-audit coverage: this reports
      # what this real release run reached, it does not gate. A branch that
      # only a real tarball download or a real formula rewrite trips stays
      # missing here even on a clean pass, which the mocked unit suite cannot
      # tell you on its own.
      #
      # Runs after the push deliberately: nothing here may sit between the
      # formula being written and the formula being pushed.
      - name: Report homebrew-release coverage
        if: always()
        run: |
          {
            echo "## Homebrew-release coverage"
            echo
            echo "Measured from this run's real tarball download and formula"
            echo "rewrite. Not gated, and not comparable to the unit,"
            echo "end-to-end, or maintenance-audit coverage numbers reported"
            echo "elsewhere."
            echo '```'
            python3 -m coverage report --rcfile=.coveragerc.maintenance-audit || echo "(no coverage data collected)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The raw data file goes under data/ to match the other coverage
      # artifacts' layout, so the combine recipe in CONTRIBUTING.md works on
      # this one too.
      - name: Package homebrew-release coverage
        if: always()
        run: |
          mkdir -p homebrew-release-coverage/data
          python3 -m coverage xml --rcfile=.coveragerc.maintenance-audit -o homebrew-release-coverage/coverage.xml || true
          python3 -m coverage html --rcfile=.coveragerc.maintenance-audit -d homebrew-release-coverage/htmlcov || true
          cp .coverage homebrew-release-coverage/data/.coverage.homebrew-release || true

      - name: Upload homebrew-release coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-homebrew-release
          path: homebrew-release-coverage/
          include-hidden-files: true
          retention-days: 30
