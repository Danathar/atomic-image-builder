---
name: Update Homebrew Formula

# The formula pins a release tarball and its sha256, and neither exists until
# the tag is published -- so the formula is always updated after a release.
# That made it the one step in the process with nothing forcing it to happen,
# while a formula left behind keeps installing the previous version. This runs
# it automatically instead.
#
# It commits the change on a `formula/<tag>` branch and pushes that branch; it
# never pushes to main. The `protect main` ruleset
# (.github/rulesets/main.json) has no bypass for anyone, and it covers only
# main, so the branch push is allowed.
#
# It does not open the pull request. Actions is not permitted to create pull
# requests in this repository, and GitHub starts no workflow runs for a pull
# request opened with GITHUB_TOKEN, so the required `test` check would never
# report on it. Instead the run summary and a reminder issue carry a link that
# opens the pull request in one click. A person opening it is what makes `test`
# run. See docs/branch-protection.md.
on:
  release:
    types: [published]
  # For re-running against a release that was published before this workflow
  # existed, or after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to point the formula at (e.g. v0.9.1)"
        required: true

# contents: write for the `formula/<tag>` branch push; issues: write for the
# reminder issue. The ruleset refuses any push to main whatever this token can
# do.
permissions:
  contents: write
  issues: write

# Serialized: two releases in quick succession must not race to rewrite the
# same file. Not cancel-in-progress -- an interrupted run could leave the
# formula updated locally but unpushed, which looks like success and is not.
concurrency:
  group: update-homebrew-formula
  cancel-in-progress: false

jobs:
  update:
    name: Point the formula at the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The release event checks out the tag; the formula lives on main.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      # homebrew_formula.py's --update path is unit-tested only against a
      # mocked fetch_sha256 (see tests/test_homebrew_formula.py), so the unit
      # number for this module is 100% without a single real tarball download
      # ever having been measured. A release is the only place --update runs
      # for real, which makes it the only place that measurement can be taken.
      # .coveragerc.maintenance-audit already scopes exactly these maintainer
      # scripts for this same "real run against live GitHub" purpose, so it is
      # reused rather than adding a fourth coverage config.
      # continue-on-error, because this measurement is advisory and updating
      # the formula is not. Before this step existed the job needed nothing
      # but python3 and the standard library; a PyPI outage or a broken
      # coverage release must not be what leaves a published release pinned to
      # the previous version. A failure here still shows up red in the run, and
      # the step below falls back to running the script unmeasured.
      - name: Install coverage tooling
        continue-on-error: true
        run: pip install coverage==7.16.0

      - name: Point the formula at the release
        id: update
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # Same reason as the step above: fall back to bare python rather than
          # let a missing coverage stop the release from being picked up.
          if python3 -m coverage --version >/dev/null 2>&1; then
            update=(python3 -m coverage run --rcfile=.coveragerc.maintenance-audit)
            # -a appends to the data file the --update run wrote, so one report
            # covers both invocations. Coverage warns here that
            # maintenance_audit is never imported -- that is expected and
            # harmless: this job runs only the one script the shared config
            # names, and coverage omits the absent module from the report.
            check=("${update[@]}" -a)
          else
            echo "::warning::coverage unavailable; updating the formula without measuring it"
            update=(python3)
            check=(python3)
          fi
          "${update[@]}" homebrew_formula.py --update "$TAG"
          # Verified independently of the code that just wrote it. This also
          # fails when a release was tagged without bumping VERSION first,
          # because --check compares the formula's tag against VERSION -- and
          # that release would ship a formula whose own test block cannot pass.
          "${check[@]}" homebrew_formula.py --check
          if git diff --quiet -- Formula/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the formula branch
        id: push
        if: steps.update.outputs.changed == 'true'
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Scoped to Formula/ rather than committing every modified tracked
          # file with -a. The step's `if:` gate tests `git diff --quiet --
          # Formula/` and `--check` verifies only the formula, so those are the
          # paths this job has actually established anything about. A pathspec
          # keeps the commit's contents equal to the verified change instead of
          # equal to whatever the working tree happened to hold.
          #
          # Fails closed if that ever diverges: another modified tracked file
          # is left unstaged, and `git rebase` below refuses to run against a
          # dirty tree, so the release goes red rather than quietly publishing
          # it. Still exits non-zero when the formula itself did not change,
          # which is what makes the `if:` above load-bearing.
          git commit -m "Point the Homebrew formula at ${TAG}" -- Formula/
          # main may have moved while the release was being published.
          git fetch origin main
          git rebase origin/main
          branch="formula/${TAG}"
          # A re-run for the same tag normally computes the same formula. When
          # the branch already carries it, the branch is left alone. A push
          # with this token starts no workflow run, so moving the branch under
          # a pull request someone already opened would leave its new commit
          # with no `test` result, and the ruleset would keep it from merging.
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            git fetch origin "refs/heads/${branch}"
            if git diff --quiet FETCH_HEAD HEAD -- Formula/; then
              echo "::notice::${branch} already carries this formula, so it was left as it is."
            else
              # The branch belongs to this workflow and holds a formula this
              # run did not verify, so it is replaced. The summary tells the
              # person to reopen a pull request already open for it.
              git push --force origin "HEAD:refs/heads/formula/${TAG}"
              echo "replaced=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git push --force origin "HEAD:refs/heads/formula/${TAG}"
          fi
          # The link that opens the pull request with its title filled in.
          # Written only once the branch holds this formula, so the summary and
          # the issue never offer a link to a branch that is not there.
          title="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "Point the Homebrew formula at ${TAG}")"
          echo "compare=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...formula/${TAG}?expand=1&title=${title}" >> "$GITHUB_OUTPUT"
          # Older formula branches are stale. `--check` above fails any tag
          # that is not the tool's VERSION on main, so a run that gets this
          # far is for the newest release. Two branches change the same
          # formula lines, and merging the older one would point Homebrew back
          # at the previous release. Deleting a branch also closes any pull
          # request opened from it.
          stale="$(git ls-remote --heads origin 'refs/heads/formula/*')"
          while read -r _sha ref; do
            case "$ref" in
              "" | "refs/heads/${branch}") ;;
              refs/heads/formula/*)
                old="${ref#refs/heads/formula/}"
                git push origin --delete "refs/heads/formula/${old}"
                ;;
            esac
          done <<< "$stale"

      # A reminder that outlasts the run page: the formula is not on main
      # until someone opens and merges the pull request. A re-run reuses the
      # open reminder for the same tag instead of filing a second one. Only an
      # issue this workflow opened counts: anyone can open an issue with that
      # title, and theirs could carry a different link. Bodies go through a
      # file so nothing in them is parsed by the shell.
      #
      # Then closes the reminders for older tags, whose branches the step
      # above deleted.
      - name: Open the reminder issue
        id: issue
        if: steps.push.outputs.compare != ''
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          COMPARE_URL: ${{ steps.push.outputs.compare }}
          REPLACED: ${{ steps.push.outputs.replaced }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          prefix="Open the Homebrew formula PR for "
          title="${prefix}${TAG}"
          open="$(gh issue list --state open --limit 1000 --json number,url,title,author \
            --jq '.[] | select(.author.login == "app/github-actions") | [.number, .url, .title] | @tsv')"
          url=""
          while IFS=$'\t' read -r _number issue_url issue_title; do
            if [ "$issue_title" = "$title" ]; then
              url="$issue_url"
              break
            fi
          done <<< "$open"
          if [ -n "$url" ] && [ "$REPLACED" = "true" ]; then
            body="$RUNNER_TEMP/formula-issue-comment.md"
            {
              echo "This run replaced the \`formula/${TAG}\` branch: ${RUN_URL}"
              echo
              echo "If the pull request is already open, close and reopen it so \`test\` runs on the new commit. Otherwise open it with the link above."
            } > "$body"
            gh issue comment "$url" --body-file "$body"
          fi
          if [ -z "$url" ]; then
            body="$RUNNER_TEMP/formula-issue-body.md"
            {
              echo "Release ${TAG} changed the Homebrew formula. The change is on the \`formula/${TAG}\` branch, not on \`main\` yet."
              echo
              echo "Open the pull request: ${COMPARE_URL}"
              echo
              echo "A person has to open it. GitHub runs no CI on a pull request opened by the workflow's own token, so \`test\` would never run and the pull request could not merge. Merge it once \`test\` passes, then close this issue."
              echo
              echo "Opened by the Update Homebrew Formula workflow: ${RUN_URL}"
            } > "$body"
            url="$(gh issue create --title "$title" --body-file "$body")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          while IFS=$'\t' read -r number _issue_url issue_title; do
            case "$issue_title" in
              "$title") ;;
              "$prefix"*) gh issue close "$number" --comment "Superseded by ${url}, for ${TAG}. Its formula branch was deleted." ;;
            esac
          done <<< "$open"

      - name: Summarize
        if: always()
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CHANGED: ${{ steps.update.outputs.changed }}
          COMPARE_URL: ${{ steps.push.outputs.compare }}
          REPLACED: ${{ steps.push.outputs.replaced }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          {
            echo "## Homebrew formula"
            echo
            if [ "$CHANGED" = "true" ] && [ -n "$COMPARE_URL" ]; then
              echo "Pointed at \`${TAG}\` on the \`formula/${TAG}\` branch. It is not on \`main\` yet."
              echo
              echo "**[Open the pull request](${COMPARE_URL})**"
              echo
              echo "A person has to open it so CI runs: GitHub runs no CI on a pull request opened by this workflow's token, so \`test\` would never report. Merge it once \`test\` passes. Users get \`${TAG}\` on their next \`brew update && brew upgrade\` after that."
              echo
              if [ "$REPLACED" = "true" ]; then
                echo "**The branch held a different formula and was replaced.** If its pull request is already open, close and reopen it so \`test\` runs on the new commit."
                echo
              fi
              if [ -n "$ISSUE_URL" ]; then
                echo "Reminder issue: ${ISSUE_URL}"
              else
                echo "**No reminder issue was opened.** The steps above say why."
              fi
            elif [ "$CHANGED" = "true" ]; then
              echo "Updated the formula for \`${TAG}\` but did not push it. The steps above say why."
            elif [ "$CHANGED" = "false" ]; then
              echo "Already pointed at \`${TAG}\`; nothing to do."
            else
              echo "Did not update the formula for \`${TAG}\`. Run this locally to see why:"
              echo
              echo '```'
              echo "python3 homebrew_formula.py --update ${TAG}"
              echo "python3 homebrew_formula.py --check"
              echo '```'
            fi
            echo
            echo '```'
            grep -E '^\s+(url|sha256)' Formula/atomic-image-builder.rb || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory only, like the weekly maintenance-audit coverage: this reports
      # what this real release run reached, it does not gate. A branch that
      # only a real tarball download or a real formula rewrite trips stays
      # missing here even on a clean pass, which the mocked unit suite cannot
      # tell you on its own.
      #
      # Runs after the push deliberately: nothing here may sit between the
      # formula being written and the formula being pushed.
      - name: Report homebrew-release coverage
        if: always()
        run: |
          {
            echo "## Homebrew-release coverage"
            echo
            echo "Measured from this run's real tarball download and formula"
            echo "rewrite. Not gated, and not comparable to the unit,"
            echo "end-to-end, or maintenance-audit coverage numbers reported"
            echo "elsewhere."
            echo '```'
            python3 -m coverage report --rcfile=.coveragerc.maintenance-audit || echo "(no coverage data collected)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The raw data file goes under data/ to match the other coverage
      # artifacts' layout, so the combine recipe in CONTRIBUTING.md works on
      # this one too.
      - name: Package homebrew-release coverage
        if: always()
        run: |
          mkdir -p homebrew-release-coverage/data
          python3 -m coverage xml --rcfile=.coveragerc.maintenance-audit -o homebrew-release-coverage/coverage.xml || true
          python3 -m coverage html --rcfile=.coveragerc.maintenance-audit -d homebrew-release-coverage/htmlcov || true
          cp .coverage homebrew-release-coverage/data/.coverage.homebrew-release || true

      - name: Upload homebrew-release coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-homebrew-release
          path: homebrew-release-coverage/
          include-hidden-files: true
          retention-days: 30
