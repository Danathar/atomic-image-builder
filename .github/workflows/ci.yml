---
name: CI

on:
  push:
  pull_request:
  # Manual runs exist so the coverage artifacts below can be produced on
  # demand for a commit that did not itself touch the measured files.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      unit_coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      # hadolint ships a static binary rather than a package, and is fetched
      # here rather than through hadolint/hadolint-action because every `uses:`
      # in this repo's workflows has to be covered by ACTION_PINS -- the table
      # shipped to generated repos -- or maintenance_audit.py fails. A linter
      # our generated repos never run does not belong in that table, so pin the
      # binary by version and checksum instead, the same way the tools above
      # are pinned by version.
      - name: Install test tooling
        run: |
          pip install coverage==7.16.0 ruff==0.16.5
          GEM_HOME="$RUNNER_TEMP/gems" gem install bashcov -v 4.0.0 --no-document --bindir "$RUNNER_TEMP/bin"
          echo "GEM_HOME=$RUNNER_TEMP/gems" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  $RUNNER_TEMP/bin/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: python3 -m coverage run -m unittest discover -s tests

      # Coverage settings (which modules, which lines are excluded) live in
      # .coveragerc so a local run reports the same numbers CI does. The
      # summary is written before the gate so a failing run still shows which
      # lines are missing.
      - name: Report coverage
        id: coverage
        run: |
          {
            echo "## Coverage"
            echo
            echo '```'
            python3 -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -m coverage report --fail-under=90
          echo "percent=$(python3 -m coverage report --format=total)" >> "$GITHUB_OUTPUT"

      # Uploaded even when the gate above fails: a run that dropped below the
      # threshold is exactly when someone wants the line-level data. The raw
      # data file ships alongside the XML so it can be combined with the
      # end-to-end data file from the container-build job -- see
      # .coveragerc.e2e for the path mapping that makes that work.
      - name: Package unit coverage
        if: always()
        run: |
          mkdir -p unit-coverage/data
          python3 -m coverage xml -o unit-coverage/coverage.xml
          python3 -m coverage html -d unit-coverage/htmlcov
          cp .coverage unit-coverage/data/.coverage.unit

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: unit-coverage/
          include-hidden-files: true
          retention-days: 30

      - name: Run ruff
        run: ruff check

      # These shell entrypoints sit outside the Python unit suite. contrib/aib
      # is the host-side wrapper users curl into ~/.local/bin, while
      # container/entrypoint.sh is baked into the published image. Behavioral
      # tests stub every external command, so neither test touches live auth or
      # host state. shellcheck ships on the ubuntu-24.04 runner image.
      #
      # The end-to-end suites are linted here rather than in container-build,
      # for the same reason hadolint is: that job is path-scoped and skips on
      # a run that touches nothing in the image, and a lint gate that only
      # runs sometimes is one nobody trusts. `-x` follows tests/e2e/lib.sh
      # into the suites that source it.
      - name: Run shellcheck
        run: |
          shellcheck -x contrib/aib container/entrypoint.sh \
            tests/test_contrib_aib.sh tests/test_entrypoint.sh \
            tests/e2e/lib.sh tests/e2e/smoke.sh tests/e2e/coverage_scenarios.sh

      # Both Containerfiles are built by the container-build job below and
      # Containerfile is what publish-image.yml ships to GHCR on every merge,
      # so they get the same lint treatment as the Python and shell sources.
      # This lives in `test` rather than `container-build` because that job is
      # path-scoped and skips entirely on a run that touches nothing in the
      # image -- and a lint gate that only runs sometimes is one nobody trusts.
      - name: Run hadolint
        run: hadolint Containerfile container/Containerfile.coverage

      # Bashcov follows the child Bash processes launched by each harness, so
      # this measures the real wrapper and container entrypoint rather than the
      # harnesses themselves. The .simplecov file restricts the report to those
      # two files. Coverage is advisory: test failures still fail this step,
      # but there is deliberately no coverage threshold.
      - name: Test shell entrypoints with coverage
        run: |
          bashcov --root "$PWD" --command-name contrib -- tests/test_contrib_aib.sh
          bashcov --root "$PWD" --command-name entrypoint -- tests/test_entrypoint.sh
          {
            echo "## Shell entrypoint coverage"
            echo
            echo "Advisory line coverage from the behavioral shell tests."
            echo '```'
            jq -r '
              "Line coverage: \(.total.lines.covered) / \(.total.lines.total) (\((.total.lines.percent * 100 | round) / 100)%)",
              (.coverage | to_entries[] | "\(.key): \(.value.covered_lines) / \(.value.total_lines) lines (\((.value.lines_covered_percent * 100 | round) / 100)%)")
            ' shell-coverage/coverage.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shell entrypoint coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shell
          path: shell-coverage/
          include-hidden-files: true
          retention-days: 30

  publish-coverage:
    name: Publish coverage badge and trend
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: coverage-data
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish coverage data
        env:
          COVERAGE_PERCENT: ${{ needs.test.outputs.unit_coverage }}
        run: |
          set -euo pipefail
          publish_root="$(mktemp -d)"
          badge_worktree="$publish_root/coverage-data"
          trap 'git worktree remove --force "$badge_worktree" 2>/dev/null || true; rmdir "$publish_root" 2>/dev/null || true' EXIT

          if git fetch origin coverage-data:refs/remotes/origin/coverage-data; then
            git worktree add --detach "$badge_worktree" refs/remotes/origin/coverage-data
          else
            git worktree add --detach "$badge_worktree"
            git -C "$badge_worktree" switch --orphan coverage-data
          fi

          python3 coverage_badge.py "$COVERAGE_PERCENT" \
            --date "$(date -u +%Y-%m-%d)" \
            --sha "$GITHUB_SHA" \
            --badge-out "$badge_worktree/coverage-unit.json" \
            --trend-out "$badge_worktree/coverage-trend.csv"

          git -C "$badge_worktree" config user.name "github-actions[bot]"
          git -C "$badge_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$badge_worktree" add coverage-unit.json coverage-trend.csv
          if git -C "$badge_worktree" diff --cached --quiet; then
            exit 0
          fi
          git -C "$badge_worktree" commit -m "chore: record unit coverage for ${GITHUB_SHA::12}"
          git -C "$badge_worktree" push origin HEAD:coverage-data

  container-build:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Path-scoped without a third-party action: only build when this push
      # or PR actually touches something baked into the image. That is the
      # Containerfile, its entrypoint, the tool script, and the bundled
      # template snapshots — all of which are COPY'd in. contrib/aib is the
      # host-side wrapper and is NOT in the image, so it is intentionally not
      # a trigger here.
      #
      # tests/e2e/ is the one trigger that is not in the image. It is what
      # proves the image, and a change to a suite that never runs the suite
      # is worse than no suite: it reads as covered. Without it a PR editing
      # only smoke.sh or coverage_scenarios.sh skips this whole job while the
      # test job merely shellchecks the files.
      #
      # Falls back to building when the diff base can't be resolved (e.g. a
      # brand new branch with no prior commit) so this never silently skips.
      - name: Check for container-related changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "${{ github.sha }}" -- Containerfile container/ atomic_image_builder.py template_snapshots/ tests/e2e/; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.changed.outputs.any_changed == 'true'
        run: podman build -t aib-ci-test -f Containerfile .

      # Every non-interactive path the packaged entrypoint has, asserted by
      # tests/e2e/smoke.sh. The suite lives in the repo rather than in this
      # step so it can be run against a locally built image without a CI run
      # -- see tests/e2e/README.md -- and so shellcheck covers it.
      - name: Smoke test the packaged entrypoint
        if: steps.changed.outputs.any_changed == 'true'
        run: tests/e2e/smoke.sh aib-ci-test

      - name: Set up Python
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install coverage tooling
        if: steps.changed.outputs.any_changed == 'true'
        run: pip install coverage==7.16.0

      # The unit suite measures the source tree, which says nothing about what
      # a real run of the built image executes. This runs the same entrypoint
      # again through a coverage shim (container/Containerfile.coverage) so the
      # packaged path is measured for real instead of inferred.
      - name: Build coverage-instrumented image
        if: steps.changed.outputs.any_changed == 'true'
        run: podman build -t aib-ci-test-cov -f container/Containerfile.coverage --build-arg BASE_IMAGE=aib-ci-test .

      # The same scenarios again, through the coverage shim. Each writes its
      # own data file so the artifact shows which lines a given invocation
      # reached, not just the union.
      - name: Collect end-to-end coverage
        if: steps.changed.outputs.any_changed == 'true'
        run: tests/e2e/coverage_scenarios.sh aib-ci-test-cov e2e-coverage/data

      - name: Report end-to-end coverage
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          # --keep leaves the per-scenario files in the artifact: they name the
          # tool by its in-image path, which is the same everywhere, so they
          # are the portable half of this artifact. The combined file is
          # deliberately not copied in beside them -- it would add nothing the
          # parts do not already carry.
          python3 -m coverage combine --rcfile=.coveragerc.e2e --keep e2e-coverage/data
          python3 -m coverage xml --rcfile=.coveragerc.e2e -o e2e-coverage/coverage.xml
          python3 -m coverage html --rcfile=.coveragerc.e2e -d e2e-coverage/htmlcov
          {
            echo "## End-to-end coverage"
            echo
            echo "Measured from real \`podman run\` invocations of the built image."
            echo "This is deliberately low -- the wizard needs a TTY -- and is not gated."
            echo
            echo '```'
            python3 -m coverage report --rcfile=.coveragerc.e2e
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload end-to-end coverage
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-e2e
          path: e2e-coverage/
          include-hidden-files: true
          retention-days: 30
