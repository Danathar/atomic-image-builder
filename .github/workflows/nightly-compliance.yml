---
name: Nightly compliance

# The gap this fills: every other job here is triggered by a change to this
# repo, so nothing catches `main` breaking because something *outside* it
# moved. The container-build job in ci.yml is path-scoped and skips entirely
# on a day nobody touched the image, which is most days -- so the published
# image's base (fedora:44), the packages it installs, and the upstream repos
# it adds can all drift under a `main` that stays green.
#
# This rebuilds the image from scratch and runs the same end-to-end suite
# against it, on a schedule instead of on a diff. A failure here means the
# world changed, not that someone pushed something.
on:
  schedule:
    # 04:17 UTC daily, well clear of the Monday 06:00 maintenance audit so a
    # bad night and a bad week do not arrive as one indistinguishable red.
    #
    # The odd minute is deliberate. GitHub delays or drops scheduled runs
    # under load, and load clusters on the hour. This job is the only detector
    # of drift from outside the repo, and a dropped run is silent -- it
    # produces no failure to notice -- so it should not queue behind everyone
    # else's midnight cron.
    - cron: "17 4 * * *"
  workflow_dispatch:

# Read-only. This job proves things; it publishes nothing and pushes nothing.
permissions:
  contents: read

jobs:
  compliance:
    name: Rebuild main and re-run the gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      # hadolint, actionlint, just and gum are here because the unit suite skips
      # tests without them (gum backs the real-gum regression tests), and a skipped test is still counted in "Ran N tests" --
      # so without these this job would report the same gate under the same
      # name while checking less than ci.yml does. Same versions and
      # checksums ci.yml pins; a test asserts they cannot drift apart.
      - name: Install test tooling
        run: |
          set -euo pipefail
          pip install coverage==7.17.0
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/bin/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/just.tar.gz" \
            https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          echo "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e  $RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/bin" just
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gum.tar.gz" \
            https://github.com/charmbracelet/gum/releases/download/v0.17.0/gum_0.17.0_Linux_x86_64.tar.gz
          echo "69ee169bd6387331928864e94d47ed01ef649fbfe875baed1bbf27b5377a6fdb  $RUNNER_TEMP/gum.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gum.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/bin" gum_0.17.0_Linux_x86_64/gum
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The offline half. These cannot break from outside, so a failure here
      # on a night when nothing was pushed would mean the runner image
      # changed under us -- worth knowing either way.
      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Check the coverage gate
        run: |
          set -euo pipefail
          threshold="$(jq -er '.gated.unit' .coverage-thresholds.json)"
          python3 -m coverage run -m unittest discover -s tests
          python3 -m coverage report --fail-under="$threshold"

      # The point of the job. ci.yml only builds when the diff touches the
      # image, so this is the only thing that would notice the base image or
      # one of its package repos breaking the build.
      - name: Build the image from scratch
        run: podman build --pull=always --no-cache -t aib-nightly -f Containerfile .

      - name: Run the end-to-end suite against it
        run: tests/e2e/smoke.sh aib-nightly

      # Local-only audit checks. The upstream half is the Monday job's;
      # running it here too would double the advisory noise for no gain.
      - name: Audit local consistency
        run: python3 maintenance_audit.py --skip-upstream

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Nightly compliance"
            echo
            echo "Rebuilt \`main\` from scratch and re-ran the gate against it."
            echo "A failure here means something outside this repository moved."
          } >> "$GITHUB_STEP_SUMMARY"

  shared-copies:
    name: Copies of the shared safety files are current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The refusal corpus is canonical here and the guards' shell reader is
      # canonical in Danathar/akmods. Each copy's own sha256 test catches a
      # local edit but not a copy that has fallen behind its original, so this
      # compares every copy with the original once a day.
      - name: Compare every copy with its original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw() { gh api "repos/$1/contents/$2" -H 'Accept: application/vnd.github.raw' | sha256sum | cut -d' ' -f1; }
          corpus=tests/fixtures/gate-refusal-corpus.json
          reader=.claude/hooks/shell-reader.mjs
          want_corpus=$(sha256sum "$corpus" | cut -d' ' -f1)
          want_reader=$(raw Danathar/akmods "$reader")
          stale=0
          check() {
            got=$(raw "$1" "$2") || got=missing
            if [ "$got" != "$3" ]; then
              echo "::error::$1 $2 is $got; the original is $3"
              stale=1
            fi
          }
          for repo in akmods arch-bootc aurora-zfs-simple dns-failover exult goodreads-mcp openaudible-autoupdate sensi tududi zfs-aurora-complex zfs-kinoite-complex; do
            check "Danathar/$repo" "$corpus" "$want_corpus"
          done
          for repo in dns-failover exult openaudible-autoupdate tududi; do
            check "Danathar/$repo" "$reader" "$want_reader"
          done
          exit "$stale"
