name: Build container image
on:
  schedule:
    - cron: '05 10 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '.atomic-image-builder.json'
      - '**/README.md'
  pull_request:
    branches:
      - main
jobs:
  build_push:
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNING_SECRET != '' }}
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && env.SIGNING_ENABLED == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && env.SIGNING_ENABLED == 'true'
        run: cosign sign --yes ghcr.io/example/test-image:latest
